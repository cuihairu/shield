schema_version: 1
id: database.sqlite
name: SQLite
version: 1.0.0
kind: database
description: SQLite provider for shield.database.v1
documentation:
  url: https://cuihairu.github.io/shield/plugins/database-sqlite
  description: SQLite provider for the shield.database.v1 interface - SQL queries, transactions, embedded deployment
entry: shield_plugin_get_v1
library:
  windows: bin/libshield_database_sqlite.dll
  linux: bin/libshield_database_sqlite.so
  macos: bin/libshield_database_sqlite.dylib
provides:
  - interface: shield.database.v1
    capabilities:
      - sql
      - transactions
  - interface: shield.pool.stats.v1
    capabilities: []
requires: []
lua:
  namespace: database.sqlite
  search_paths: []
config_schema:
  type: object
  properties:
    database:
      type: string
      default: ':memory:'
    query_timeout_ms:
      type: integer
      default: 5000
      minimum: 1
      maximum: 300000
    async:
      type: boolean
      default: true
      description: Serve query/query_one/execute through the worker thread and suspend the calling coroutine (false = synchronous entry)
    call_timeout_ms:
      type: integer
      default: 0
      minimum: 0
      maximum: 300000
      description: Caller-side suspend budget for async entry; 0 means query_timeout_ms + 500ms slack
