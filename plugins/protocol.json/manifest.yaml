schema_version: 1
id: protocol.json
name: JSON Protocol Codec
version: 1.0.0
kind: protocol
description: JSON provider for shield.protocol.codec.v1 with optional payload schema validation
documentation:
  url: https://cuihairu.github.io/shield/protocol-codec-plugins
  description: Validating JSON BodyCodec provider for JSON-shaped protocol profiles
entry: shield_plugin_get_v1
library:
  windows: bin/libshield_protocol_json.dll
  linux: bin/libshield_protocol_json.so
  macos: bin/libshield_protocol_json.dylib
provides:
  - interface: shield.protocol.codec.v1
    capabilities:
      - json
requires: []
lua:
  namespace: protocol.json
  search_paths: []
config_schema:
  type: object
  properties:
    schemas:
      type: object
    schemas_file:
      type: string
    require_schema:
      type: boolean
    on_violation:
      type: string
      enum: [reject, warn]
