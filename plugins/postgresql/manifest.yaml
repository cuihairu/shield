schema_version: 1
id: database.postgresql
name: PostgreSQL
version: 1.0.0
kind: database
description: libpq-based PostgreSQL provider for shield.database.v1
documentation:
  url: https://cuihairu.github.io/shield/plugins/database-postgresql
  description: PostgreSQL provider for the shield.database.v1 interface via libpq
entry: shield_plugin_get_v1
library:
  windows: bin/libshield_db_pgsql.dll
  linux: bin/libshield_db_pgsql.so
  macos: bin/libshield_db_pgsql.dylib
provides:
  - interface: shield.database.v1
    capabilities:
      - sql
      - transactions
  - interface: shield.pool.stats.v1
    capabilities: []
requires: []
lua:
  namespace: database.postgresql
  search_paths: []
config_schema:
  type: object
  required:
    - host
    - database
    - username
  properties:
    host:
      type: string
      default: 127.0.0.1
    port:
      type: integer
      default: 5432
      minimum: 1
      maximum: 65535
    database:
      type: string
    username:
      type: string
    password:
      type: string
      secret: true
    connect_timeout_ms:
      type: integer
      default: 5000
      minimum: 100
      maximum: 60000
    query_timeout_ms:
      type: integer
      default: 5000
      minimum: 100
      maximum: 300000
    pool_size:
      type: integer
      default: 4
      minimum: 1
      maximum: 256
    async:
      type: boolean
      default: true
      description: >-
        query / query_one / execute suspend the calling coroutine and run on
        the instance worker pool (pool acquire included), so the service keeps
        dispatching other messages. false restores the synchronous inline
        entry. See docs/db-async-design.md.
    call_timeout_ms:
      type: integer
      default: 0
      minimum: 0
      maximum: 300000
      description: >-
        Caller-side suspend budget for the async entry. 0 means
        query_timeout_ms + 500. On timeout the caller resumes with
        {code="timeout", retryable=true}; the late real result is dropped, not
        delivered over the timeout error.

