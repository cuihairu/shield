# Shield default Phase 1 runtime configuration.

app:
  name: shield
  version: "0.1.0"

# The transport/subsystem listen port is pinned explicitly: starting the
# node with --node-id implicitly enables the cluster subsystem, whose
# default listen address (0.0.0.0:9000) collides with common dev-stack
# services on developer machines.
cluster:
  listen: 127.0.0.1:19000

log:
  level: info
  console: true

# 崩溃采集（Crashpad，docs/crash-reporting.md）：独立 crashpad_handler
# 进程捕获崩溃写 minidump 到本地目录。enabled 缺省 false（测试夹具
# 不配即不启用）；产品面显式开启。上传留位默认关，外发属数据外发。
crash:
  enabled: true
  dump_dir: ""            # 空 = ./crash（相对运行目录；容器内 /app/crash）
  handler_path: ""        # 空 = shield 可执行同目录的 crashpad_handler
  upload_url: ""          # 留位：非空仅记告警占位，不外发

lua:
  vm:
    mode: per_service
    max_vms: 128
    max_memory_mb: 64
  sandbox:
    allow_os: false
    allow_io: false
  script_path: "scripts"
  module_path: "scripts/?.lua;scripts/?/init.lua"
  cache:
    enabled: true
    max_size: 100
    ttl_seconds: 0

actors:
  - name: bootstrap
    script: ../scripts/bootstrap.lua
    instances: 1
    required: true

  # 最小可观测服务：无认证 echo 闭环（c2s echo id=1 → s2c echo_result
  # id=100，idlen + JSON）。启动后即可连接 0.0.0.0:7900 验证，
  # 帧格式与示例客户端见 scripts/client_demo.py。
  - name: echo
    script: ../scripts/echo.lua
    instances: 1
    required: true
    network:
      tcp: "0.0.0.0:7900"
      protocol:
        envelope:
          type: "idlen"
          route_id_bytes: 2
          length_bytes: 2
          endian: "big"
        body:
          codec: "json"
    rpc:
      routes:
        - id: 1
          name: "echo"
          binding: "echo"
          direction: "c2s"
          requires_auth: false
        - id: 100
          name: "echo_result"
          binding: "echo_result"
          direction: "s2c"

# Plugin system v1 is enabled by the runtime, but the default config declares no
# plugin instances so a fresh checkout boots without external provider DLLs.
# See config/app-with-sqlite.yaml for an optional SQLite-backed example.

bootstrap:
  timeout:
    config_load: 5000
    log_init: 5000
    core_init: 10000
    plugin_init: 30000
    net_init: 10000
    script_init: 10000
    service_spawn: 60000

shutdown:
  timeout:
    service_drain: 30000
    service_stop: 10000
    plugin_shutdown: 10000
    total: 60000

# Console server
console:
  enabled: true
  socket_path: /tmp/shield-console.sock

# HTTP ops endpoints
http:
  enabled: true
  host: "127.0.0.1"
  port: 8080
