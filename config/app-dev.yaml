# Development environment configuration overlay.
# Merge over a base config: shield --config config/app.yaml --config config/app-dev.yaml
# Only keys the runtime actually consumes are listed here.

log:
  level: "debug"

lua:
  script_path: "scripts"
  module_path: "scripts/?.lua;scripts/?/init.lua"
  cache:
    enabled: false  # 开发环境禁用缓存，每次重读脚本
    max_size: 50
    ttl_seconds: 300
