# Production environment configuration overlay.
# Merge over a base config: shield --config config/app.yaml --config config/app-prod.yaml
# Only keys the runtime actually consumes are listed here.

log:
  level: "warn"

lua:
  script_path: "scripts"
  module_path: "scripts/?.lua;scripts/?/init.lua"
  cache:
    enabled: true   # 生产环境启用缓存提升性能
    max_size: 200
    ttl_seconds: 0  # 永不过期
