name: Optional Plugins CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup clang-format
        run: pip install clang-format

      - name: Check C++ formatting
        run: |
          find include src -name "*.hpp" -o -name "*.cpp" 2>/dev/null | \
          xargs -r clang-format --dry-run --Werror || { echo "::warning::C++ formatting issues detected - run clang-format to fix"; exit 0; }

  build-plugins:
    name: Build Plugins (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            compiler: gcc
            timeout_minutes: 60
          - os: macos-latest
            compiler: clang
            timeout_minutes: 60
          - os: windows-latest
            compiler: msvc
            timeout_minutes: 90
            build_parallel: 2

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 安装依赖
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew untap aws/tap || true
          brew install cmake ninja clang-format

      # Export GitHub Actions cache credentials so vcpkg can use the native
      # `x-gha` binary source (caches compiled packages across runs instead
      # of rebuilding yaml-cpp etc. from source every time).
      - name: Export GHA cache credentials
        uses: actions/github-script@v9
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      # Cache installed artifacts (downloaded source/binary packages are
      # cached by x-gha above). Do NOT cache the vcpkg source tree — it is
      # managed by run-vcpkg and caching it triggers git pathspec errors.
      - name: Cache vcpkg installed
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/build/vcpkg_installed
          key: vcpkg-plugins-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-plugins-${{ runner.os }}-

      # Setup vcpkg (pinned commit + x-gha binary caching).
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        env:
          VCPKG_BINARY_SOURCES: 'clear;x-gha,readwrite'
        with:
          vcpkgGitCommitId: 'a0b1c8d3a477c1cb4813d8e127a56961707ca42b'

      # Configure with all optional plugins enabled
      - name: Configure
        shell: bash
        run: |
          CMAKE_ARGS=(
            -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake
            -DCMAKE_BUILD_TYPE=Release
            -DCMAKE_CXX_SCAN_FOR_MODULES=OFF
            -DSHIELD_BUILD_TESTS=ON
            -DSHIELD_BUILD_EXAMPLES=OFF
            -DSHIELD_BUILD_PLUGIN_PROTOBUF=ON
            -DSHIELD_BUILD_PLUGIN_MSGPACK=ON
            -DSHIELD_BUILD_PLUGIN_SPROTO=ON
            -DSHIELD_BUILD_PLUGIN_FLATBUFFERS=ON
          )

          if [ "$RUNNER_OS" == "Windows" ]; then
            CMAKE_ARGS+=(-G "Visual Studio 18 2026" -A x64)
          else
            CMAKE_ARGS+=(-G Ninja)
          fi

          cmake -B build -S . "${CMAKE_ARGS[@]}"

      # Build
      - name: Build
        shell: bash
        run: |
          cmake --build build --parallel ${{ matrix.build_parallel || 4 }}

      # Test
      - name: Test
        shell: bash
        working-directory: build
        run: |
          ctest --output-on-failure --timeout 120 -L "plugin;protocol" || true

      # Upload build artifacts on failure for debugging
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ runner.os }}
          path: |
            build/CMakeFiles/CMakeOutput.log
            build/CMakeFiles/CMakeError.log
          retention-days: 7

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build-plugins
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: shield:pr-${{ github.event.pull_request.number || 'latest' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1
