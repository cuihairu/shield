name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  BUILD_TYPE: Release

jobs:
  # 代码质量检查
  code-quality:
    name: Code Quality
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup clang-format
        run: pip install clang-format

      - name: Check C++ formatting
        run: |
          find include src -name "*.hpp" -o -name "*.cpp" 2>/dev/null | \
          xargs -r clang-format --dry-run --Werror || { echo "::warning::C++ formatting issues detected - run clang-format to fix"; exit 0; }

  # 多平台构建
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            compiler: gcc
            timeout_minutes: 45
          - os: macos-latest
            compiler: clang
            timeout_minutes: 45
          - os: windows-latest
            compiler: msvc
            timeout_minutes: 90
            build_parallel: 2

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 安装依赖
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew untap aws/tap || true
          brew install cmake ninja clang-format

      # Export GitHub Actions cache credentials so vcpkg can use the native
      # `x-gha` binary source (caches compiled packages across runs instead
      # of rebuilding yaml-cpp etc. from source every time).
      - name: Export GHA cache credentials
        uses: actions/github-script@v9
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      # Cache installed artifacts (downloaded source/binary packages are
      # cached by x-gha above). Do NOT cache the vcpkg source tree — it is
      # managed by run-vcpkg and caching it triggers git pathspec errors.
      - name: Cache vcpkg installed
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/build/vcpkg_installed
          key: vcpkg-installed-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-installed-${{ runner.os }}-

      # Setup vcpkg (pinned commit + x-gha binary caching).
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        env:
          VCPKG_BINARY_SOURCES: 'clear;x-gha,readwrite'
        with:
          vcpkgGitCommitId: 'a0b1c8d3a477c1cb4813d8e127a56961707ca42b'

      # Configure
      - name: Configure
        shell: bash
        run: |
          CMAKE_ARGS=(
            -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake
            -DCMAKE_BUILD_TYPE=Release
            -DCMAKE_CXX_SCAN_FOR_MODULES=OFF
            -DSHIELD_BUILD_TESTS=ON
            -DSHIELD_BUILD_EXAMPLES=ON
            -DSHIELD_BUILD_PLUGIN_PROTOBUF=ON
            -DSHIELD_BUILD_PLUGIN_MSGPACK=ON
          )

          if [ "$RUNNER_OS" == "Windows" ]; then
            CMAKE_ARGS+=(-G "Visual Studio 18 2026" -A x64)
          else
            CMAKE_ARGS+=(-G Ninja)
          fi

          cmake -B build "${CMAKE_ARGS[@]}"

      # Build
      - name: Build
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            cmake --build build --config Release --parallel $(nproc)
          elif [ "$RUNNER_OS" == "macOS" ]; then
            cmake --build build --config Release --parallel $(sysctl -n hw.logicalcpu)
          else
            cmake --build build --config Release --parallel ${{ matrix.build_parallel }}
          fi

      - name: Test
        shell: bash
        run: ctest --test-dir build --build-config Release --output-on-failure

  # 集群模块 (Linux, SHIELD_ENABLE_CLUSTER=ON): 构建 cluster 路径并运行
  # cluster 标签测试。主 build 矩阵不带 cluster，此 job 补上该编译路径。
  cluster:
    name: Cluster
    runs-on: ubuntu-26.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config

      - name: Export GHA cache credentials
        uses: actions/github-script@v9
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Cache vcpkg installed
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/build-cluster/vcpkg_installed
          key: vcpkg-installed-cluster-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-installed-cluster-

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        env:
          VCPKG_BINARY_SOURCES: 'clear;x-gha,readwrite'
        with:
          vcpkgGitCommitId: 'a0b1c8d3a477c1cb4813d8e127a56961707ca42b'

      - name: Configure (cluster enabled)
        run: >
          cmake -B build-cluster -G Ninja
          -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_SCAN_FOR_MODULES=OFF
          -DSHIELD_BUILD_TESTS=ON
          -DSHIELD_BUILD_EXAMPLES=OFF
          -DSHIELD_ENABLE_CLUSTER=ON

      - name: Build
        run: cmake --build build-cluster --parallel $(nproc)

      - name: Test
        run: ctest --test-dir build-cluster --build-config Release -L cluster --output-on-failure

  # 覆盖率 (Linux, gcov + gcovr): 运行 tests/coverage 全部套件并统计
  # src/ 行覆盖率；低于 97% 时失败。
  coverage:
    name: Coverage
    runs-on: ubuntu-26.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config
          python3 -m pip install gcovr==8.6

      - name: Export GHA cache credentials
        uses: actions/github-script@v9
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Cache vcpkg installed
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/build-cov/vcpkg_installed
          key: vcpkg-installed-coverage-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-installed-coverage-

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        env:
          VCPKG_BINARY_SOURCES: 'clear;x-gha,readwrite'
        with:
          vcpkgGitCommitId: 'a0b1c8d3a477c1cb4813d8e127a56961707ca42b'

      - name: Configure (coverage)
        run: >
          cmake -B build-cov -G Ninja
          -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_SCAN_FOR_MODULES=OFF
          -DSHIELD_BUILD_TESTS=ON
          -DSHIELD_BUILD_EXAMPLES=OFF
          -DSHIELD_ENABLE_COVERAGE=ON

      - name: Build tests
        run: cmake --build build-cov --parallel $(nproc)

      - name: Run coverage suites
        working-directory: build-cov
        run: ctest --build-config Debug -L coverage --output-on-failure

      - name: Collect coverage report
        shell: bash
        run: |
          SUMMARY_FILE=coverage-summary.md
          cd build-cov
          gcovr -r . \
            --exclude-directories '^\.(?!$)' \
            --filter '\.\./src/' \
            --txt coverage.txt \
            --xml coverage.xml \
            --html-details coverage.html \
            --gcov-ignore-parse-errors negative_hits.warn \
            --fail-under-line 98
          TOTAL=$(grep -E '^TOTAL' coverage.txt)
          echo "### Line coverage (src/)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$TOTAL" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build-cov/coverage.xml
          fail_ci_if_error: true

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            build-cov/coverage.txt
            build-cov/coverage.xml
            build-cov/coverage*.html

  # Docker 构建 (仅 main 分支)
  docker:
    name: Docker Build
    runs-on: ubuntu-26.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
