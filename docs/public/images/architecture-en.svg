<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1260" viewBox="0 0 1280 1260" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">Shield · Lua-first Game Server Runtime</title>
<desc id="desc">Skynet-inspired actor-model, Lua-first, single-node-first runtime. Top-down: game logic (Lua services), C++ runtime core (Lua VM, service registry, send/call, timers, coroutines/CAF), network &amp; transport (TCP listener, gateway), plugin system v1 (manifest-first, stable C ABI, dependency injection), official plugins (DB, Redis, Auth, Metrics/Health, Matchmaking, codecs), optional modules (cluster/global/player/server/ops, OFF by default), external backends (MySQL/PostgreSQL/SQLite/MongoDB/Redis/Prometheus). Right rail is runtime support (config, log, crash, console) and the xmldef toolchain.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="context-stroke"/></marker></defs>
<style>text{font-family:Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#172b4d}.title{font-size:30px;font-weight:700}.sub{font-size:17px;fill:#435570}.band{font-size:16px;font-weight:700}.layer{font-size:18px;font-weight:700}.layerbody{font-size:13px;fill:#435570}.chip{font-size:15px;font-weight:700}.chipbody{font-size:12px;fill:#435570}.small{font-size:13px;fill:#52647b}.label{font-size:13px;fill:#435570;paint-order:stroke;stroke:#f8fafc;stroke-width:5px;stroke-linejoin:round}.edge{fill:none;stroke-linejoin:round}.control{stroke-dasharray:7 5}</style>
