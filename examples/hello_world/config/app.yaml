# Shield Hello World - 客户端 RPC 闭环示例
#
# 单一 target 模型:每个 session 绑定唯一目标服务。
#   登录前 target = auth(预登录 login);shield.client.bind 成功后
#   target 原子切换到 player;room 由 player 用 shield.send 私有转发。
#
# 客户端 RPC 的唯一静态来源是 actors[].rpc.routes:bootstrap 把所有
# actor 的条目合并为全局 descriptor 表(route id/name 冲突即启动失败),
# 每个 VM 只编译 owner 为自身的条目。

app:
  name: "hello_world"
  version: "1.0.0"

log:
  level: "info"
  console: true

actors:
  # 认证入口:TCP 监听 + 协议管线 + 预登录 login / login_result
  - name: "auth"
    script: "../scripts/auth.lua"
    instances: 1
    network:
      tcp: "0.0.0.0:8001"
      protocol:
        # idlen:route id 走帧头([route_id:2B BE][length:2B BE][body]),
        # body 是纯业务 JSON,不含任何路由字段。
        envelope:
          type: "idlen"
          route_id_bytes: 2
          length_bytes: 2
          endian: "big"
        body:
          codec: "json"
    rpc:
      routes:
        - id: 1
          name: "login"
          binding: "login"
          direction: "c2s"
          requires_auth: false
        - id: 100
          name: "login_result"
          binding: "login_result"
          direction: "s2c"

  # 玩家服务:认证后的 session target,持有 move 入站路由
  - name: "player"
    script: "../scripts/player.lua"
    instances: 1
    rpc:
      routes:
        - id: 2
          name: "move"
          binding: "move"
          direction: "c2s"
          requires_auth: true

  # 房间服务:由 player 私有转发到达,持有 move_result 出站路由
  - name: "room"
    script: "../scripts/room.lua"
    instances: 1
    rpc:
      routes:
        - id: 200
          name: "move_result"
          binding: "move_result"
          direction: "s2c"

# 后端能力通过插件系统 v1 显式启用。
# Lua 业务代码使用 binding 逻辑名访问后端能力,例如
# shield.database.sqlite("database.default")。
# hello_world 默认不依赖外部 DB/Redis;需要时取消注释并提供对应插件包。
